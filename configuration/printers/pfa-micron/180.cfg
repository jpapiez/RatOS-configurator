[stepper_x]
position_max: 180
position_endstop: 180

[stepper_y]
position_max: 180
position_endstop: 180

[stepper_z]
position_max: 165

[bed_mesh]
speed: 300
horizontal_move_z: 10
mesh_min: 10,10
mesh_max: 170,170
fade_start: 0.6
fade_end: 10.0
probe_count: 5,5
algorithm: bicubic

[quad_gantry_level]
gantry_corners:
  -60.2,-10.4
  244.1,234.5
#  Probe points
points:
  13,1
  13,140
  160,140
  160,1
  
speed: 100
horizontal_move_z: 8
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X90 Y90 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32
