[stepper_x]
position_max: 115
position_endstop: 115 

[stepper_y]
position_max: 123
position_endstop: 123 

[stepper_z]
position_max: 110

[quad_gantry_level]
gantry_corners:
  -54.5,-2.15
  170,180
#  Probe points
points:
  5,5
  5,80
  110,80
  110,5
speed: 100
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X125 Y125 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32
